name: Lint

on:
  pull_request:
  push:
  workflow_dispatch:
    inputs:
      myCommit:
        description: Commit SHA1
        required: false
        default: ''
        type: string

# A new push into a PR auto-cancels the run for the previous one. Master and nightly unaffected.
concurrency:
  group: lint-${{github.event.pull_request.number || github.run_id}}
  cancel-in-progress: true

env:
  LLS_TAG: '3.19.1'
  CLANG_TIDY_VERSION: '22.1.8'
  DOXYGEN_VERSION: '1.9.5'
  MOLD_VERSION: '2.36.0'

defaults:
  run:
    shell: bash

jobs:
  lint:
    timeout-minutes: 60
    runs-on: ubuntu-26.04
    steps:
      - name: 'Checkout'
        uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
          ref: ${{inputs.myCommit}}

      # The configure step hard-errors on linux unless lld or mold is present.
      - name: 'Install mold'
        uses: rui314/setup-mold@v1
        with:
          mold-version: ${{env.MOLD_VERSION}}
          make-default: false

      # The configure step resolves OpenGL, so the GL development files have to be there.
      # The shader checks run glslangValidator, which comes from glslang-tools.
      - name: 'Install dependencies'
        uses: Wandalen/wretry.action@v3.8.0
        with:
          attempt_limit: 3
          attempt_delay: 5000
          command: |
            sudo apt-get update
            sudo apt-get install -y libglu1-mesa-dev glslang-tools

      # Unpacked outside the workspace on purpose. Inside it, lua-language-server lints its own lua sources.
      - name: 'Install lua-language-server'
        run: |
          mkdir -p "$HOME/lua-language-server"
          curl -fsSL -o "$RUNNER_TEMP/lls.tar.gz" "https://github.com/LuaLS/lua-language-server/releases/download/$LLS_TAG/lua-language-server-$LLS_TAG-linux-x64.tar.gz"
          tar xzf "$RUNNER_TEMP/lls.tar.gz" -C "$HOME/lua-language-server"

      - name: 'Install clang-tidy'
        run: |
          pip install --break-system-packages "clang-tidy==$CLANG_TIDY_VERSION"

      - name: 'Install doxygen'
        run: |
          mkdir -p "$HOME/doxygen"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/doxygen.tar.gz" "https://github.com/doxygen/doxygen/releases/download/Release_${DOXYGEN_VERSION//./_}/doxygen-$DOXYGEN_VERSION.linux.bin.tar.gz"
          tar xzf "$RUNNER_TEMP/doxygen.tar.gz" --strip-components=2 -C "$HOME/doxygen" "doxygen-$DOXYGEN_VERSION/bin/doxygen"

      # clang-tidy needs the dependency headers and a compile commands database, so this is a full configure.
      # The cpp style, lua style and clang-tidy checks all run off it.
      - name: 'Configure'
        id: configure
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DOE_LLS_COMMAND="$HOME/lua-language-server/bin/lua-language-server"

      - name: 'Check cpp style'
        working-directory: build
        run: |
          ninja check_cpp_style

      # Gated on the configure rather than on the previous step, so that one push reports every verdict.
      - name: 'Check lua style'
        if: ${{!cancelled() && steps.configure.outcome == 'success'}}
        working-directory: build
        run: |
          ninja check_style_lua_scripts

      - name: 'Run clang-tidy'
        if: ${{!cancelled() && steps.configure.outcome == 'success'}}
        working-directory: build
        run: |
          ninja check_tidy

      # The shader and doxygen checks need no build tree, so they run regardless of how the configure went.
      - name: 'Check shaders'
        if: ${{!cancelled()}}
        run: |
          for glsl_version in "410 core" "320 es"; do
            for shader in resources/shaders/*.vert resources/shaders/*.frag; do
              echo "Checking $shader against GLSL $glsl_version..."
              ./scripts/check_shader.sh "$shader" "$glsl_version"
            done
            for shader in resources/shaders/{glterrain,gloutbuild,glbspshader}.{vert,frag}; do
              echo "Checking $shader with MATERIAL_MAPS against GLSL $glsl_version..."
              ./scripts/check_shader.sh "$shader" "$glsl_version" MATERIAL_MAPS
              echo "Checking $shader with MATERIAL_MAPS and LINEAR_PIPELINE against GLSL $glsl_version..."
              ./scripts/check_shader.sh "$shader" "$glsl_version" MATERIAL_MAPS LINEAR_PIPELINE
            done
            for shader in resources/shaders/glbloom.{vert,frag}; do
              echo "Checking $shader with BLOOM_UPSAMPLE against GLSL $glsl_version..."
              ./scripts/check_shader.sh "$shader" "$glsl_version" BLOOM_UPSAMPLE
            done
            for shader in resources/shaders/{glterrain,gloutbuild}.{vert,frag}; do
              for defines in "SUN_SHADOWS" "SUN_SHADOWS MATERIAL_MAPS" "SUN_SHADOWS LINEAR_PIPELINE" "SUN_SHADOWS MATERIAL_MAPS LINEAR_PIPELINE"; do
                echo "Checking $shader with $defines against GLSL $glsl_version..."
                ./scripts/check_shader.sh "$shader" "$glsl_version" $defines
              done
            done
            for shader in resources/shaders/glbillbshader.{vert,frag}; do
              for defines in "SUN_SHADOWS" "SUN_SHADOWS LINEAR_PIPELINE" "SPRITE_CROSSFADE" "SPRITE_CROSSFADE LINEAR_PIPELINE" "SPRITE_CROSSFADE SUN_SHADOWS LINEAR_PIPELINE" "SPRITE_DEPTH LINEAR_PIPELINE" "SPRITE_DEPTH SPRITE_CROSSFADE SUN_SHADOWS LINEAR_PIPELINE" "SPRITE_DEPTH SPRITE_LIGHTING LINEAR_PIPELINE" "SPRITE_DEPTH SPRITE_LIGHTING SPRITE_CROSSFADE SUN_SHADOWS LINEAR_PIPELINE"; do
                echo "Checking $shader with $defines against GLSL $glsl_version..."
                ./scripts/check_shader.sh "$shader" "$glsl_version" $defines
              done
            done
            for shader in resources/shaders/glbspshader.{vert,frag}; do
              for defines in "TORCH_SHADOWS" "TORCH_SHADOWS MATERIAL_MAPS" "TORCH_SHADOWS LINEAR_PIPELINE" "TORCH_SHADOWS MATERIAL_MAPS LINEAR_PIPELINE"; do
                echo "Checking $shader with $defines against GLSL $glsl_version..."
                ./scripts/check_shader.sh "$shader" "$glsl_version" $defines
              done
            done
            for shader in resources/shaders/{glterrain,gloutbuild}.{vert,frag}; do
              for defines in "AMBIENT_OCCLUSION LINEAR_PIPELINE" "AMBIENT_OCCLUSION LINEAR_PIPELINE MATERIAL_MAPS" "AMBIENT_OCCLUSION LINEAR_PIPELINE SUN_SHADOWS" "AMBIENT_OCCLUSION LINEAR_PIPELINE MATERIAL_MAPS SUN_SHADOWS"; do
                echo "Checking $shader with $defines against GLSL $glsl_version..."
                ./scripts/check_shader.sh "$shader" "$glsl_version" $defines
              done
            done
            for shader in resources/shaders/glbspshader.{vert,frag}; do
              for defines in "AMBIENT_OCCLUSION LINEAR_PIPELINE" "AMBIENT_OCCLUSION LINEAR_PIPELINE MATERIAL_MAPS" "AMBIENT_OCCLUSION LINEAR_PIPELINE TORCH_SHADOWS" "AMBIENT_OCCLUSION LINEAR_PIPELINE MATERIAL_MAPS TORCH_SHADOWS"; do
                echo "Checking $shader with $defines against GLSL $glsl_version..."
                ./scripts/check_shader.sh "$shader" "$glsl_version" $defines
              done
            done
            for shader in resources/shaders/glterrain.{vert,frag}; do
              for defines in "TERRAIN_VARIATION LINEAR_PIPELINE" "TERRAIN_VARIATION LINEAR_PIPELINE MATERIAL_MAPS" "TERRAIN_VARIATION LINEAR_PIPELINE MATERIAL_MAPS SUN_SHADOWS AMBIENT_OCCLUSION"; do
                echo "Checking $shader with $defines against GLSL $glsl_version..."
                ./scripts/check_shader.sh "$shader" "$glsl_version" $defines
              done
            done
            for shader in resources/shaders/{glterrain,gloutbuild}.{vert,frag}; do
              for defines in "GLOBAL_ILLUMINATION LINEAR_PIPELINE" "GLOBAL_ILLUMINATION LINEAR_PIPELINE MATERIAL_MAPS SUN_SHADOWS AMBIENT_OCCLUSION"; do
                echo "Checking $shader with $defines against GLSL $glsl_version..."
                ./scripts/check_shader.sh "$shader" "$glsl_version" $defines
              done
            done
            for shader in resources/shaders/glbspshader.{vert,frag}; do
              for defines in "GLOBAL_ILLUMINATION LINEAR_PIPELINE" "GLOBAL_ILLUMINATION LINEAR_PIPELINE MATERIAL_MAPS TORCH_SHADOWS AMBIENT_OCCLUSION"; do
                echo "Checking $shader with $defines against GLSL $glsl_version..."
                ./scripts/check_shader.sh "$shader" "$glsl_version" $defines
              done
            done
            for shader in resources/shaders/glbillbshader.{vert,frag}; do
              for defines in "GLOBAL_ILLUMINATION LINEAR_PIPELINE" "GLOBAL_ILLUMINATION SUN_SHADOWS LINEAR_PIPELINE" "GLOBAL_ILLUMINATION SPRITE_DEPTH SPRITE_LIGHTING SPRITE_CROSSFADE SUN_SHADOWS LINEAR_PIPELINE"; do
                echo "Checking $shader with $defines against GLSL $glsl_version..."
                ./scripts/check_shader.sh "$shader" "$glsl_version" $defines
              done
            done
            for shader in resources/shaders/{glterrain,gloutbuild}.{vert,frag}; do
              for defines in "SKY_AMBIENT LINEAR_PIPELINE" "SKY_AMBIENT LINEAR_PIPELINE GLOBAL_ILLUMINATION MATERIAL_MAPS SUN_SHADOWS AMBIENT_OCCLUSION"; do
                echo "Checking $shader with $defines against GLSL $glsl_version..."
                ./scripts/check_shader.sh "$shader" "$glsl_version" $defines
              done
            done
            for shader in resources/shaders/glbillbshader.{vert,frag}; do
              for defines in "SKY_AMBIENT LINEAR_PIPELINE" "SKY_AMBIENT SPRITE_DEPTH SPRITE_LIGHTING LINEAR_PIPELINE" "SKY_AMBIENT GLOBAL_ILLUMINATION SPRITE_DEPTH SPRITE_LIGHTING SPRITE_CROSSFADE SUN_SHADOWS LINEAR_PIPELINE"; do
                echo "Checking $shader with $defines against GLSL $glsl_version..."
                ./scripts/check_shader.sh "$shader" "$glsl_version" $defines
              done
            done
            for shader in resources/shaders/glbillbshader.{vert,frag}; do
              for defines in "WIND_SWAY" "WIND_SWAY LINEAR_PIPELINE" "WIND_SWAY SKY_AMBIENT GLOBAL_ILLUMINATION SPRITE_DEPTH SPRITE_LIGHTING SPRITE_CROSSFADE SUN_SHADOWS LINEAR_PIPELINE"; do
                echo "Checking $shader with $defines against GLSL $glsl_version..."
                ./scripts/check_shader.sh "$shader" "$glsl_version" $defines
              done
            done
            for shader in resources/shaders/glao.{vert,frag}; do
              echo "Checking $shader with AO_BLUR against GLSL $glsl_version..."
              ./scripts/check_shader.sh "$shader" "$glsl_version" AO_BLUR
            done
            for shader in resources/shaders/glshadow.{vert,frag}; do
              echo "Checking $shader with SHADOW_SPRITE against GLSL $glsl_version..."
              ./scripts/check_shader.sh "$shader" "$glsl_version" SHADOW_SPRITE
            done
            for shader in resources/shaders/glcomposite.{vert,frag}; do
              for defines in "FILMIC_TONEMAP" "FILMIC_TONEMAP EYE_ADAPTATION"; do
                echo "Checking $shader with $defines against GLSL $glsl_version..."
                ./scripts/check_shader.sh "$shader" "$glsl_version" $defines
              done
            done
            for shader in resources/shaders/glluminance.{vert,frag}; do
              echo "Checking $shader with EYE_ADAPT against GLSL $glsl_version..."
              ./scripts/check_shader.sh "$shader" "$glsl_version" EYE_ADAPT
            done
            for shader in resources/shaders/{glterrain,gloutbuild,glbspshader,glbillbshader,gldecalshader,glforcepershader,glskyshader}.{vert,frag}; do
              echo "Checking $shader with LINEAR_PIPELINE against GLSL $glsl_version..."
              ./scripts/check_shader.sh "$shader" "$glsl_version" LINEAR_PIPELINE
            done
          done

      # Doxyfile sets WARN_AS_ERROR, so generating the docs is the check.
      - name: 'Check doxygen'
        if: ${{!cancelled()}}
        run: |
          "$HOME/doxygen/doxygen" Doxyfile
